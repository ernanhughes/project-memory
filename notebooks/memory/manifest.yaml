# Notebook manifest: chapter -> notebook -> implementation -> experiment.
# Auditable mapping for the Memory book companion notebooks.
# Naming: NN-chapter.ipynb mirrors content/books/memory/NN-chapter.md.
# Validation: python scripts/validate_notebooks.py
# Browser HTML rendering: deferred (see notebooks/memory/README.md).

execution_classes:
  DETERMINISTIC: "runs from fixtures and package code; no services"
  ARTIFACT_BACKED: "real code plus committed frozen artifacts by default"
  OPTIONAL_LIVE: "artifact-backed by default; live rerun needs local services"
  CAPSTONE: "integrated system replayed over frozen contexts"

